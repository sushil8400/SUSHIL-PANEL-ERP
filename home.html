{% extends "base.html" %}{% block body %}<h2>Saved Costings</h2><p><a class="btn" href="/new">+ New Costing</a></p><table class="table"><tr><th>No.</th><th>Customer</th><th>Panel</th><th>Grand Total</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{r.number}}</td><td>{{r.customer}}</td><td>{{r.panel}}</td><td>₹ {{'%.2f'|format(r.grand)}}</td><td><a href="/edit/{{r.id}}">View/Edit</a> | <a href="/export/{{r.id}}">Excel</a></td></tr>{% endfor %}</table>{% endblock %}
