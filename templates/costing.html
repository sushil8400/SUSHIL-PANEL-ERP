<!DOCTYPE html>
<html>
<head>
    <title>New Costing - SUSHIL PANEL ERP</title>
    <style>
        body{font-family:Arial;margin:25px;background:#f4f6f8}
        .box{background:white;padding:20px}
        input{padding:8px;margin:4px;width:150px}
        button{padding:10px 18px;background:#1677ff;color:white;border:0}
        table{width:100%;border-collapse:collapse}
        th,td{border:1px solid #bbb;padding:6px}
    </style>
</head>
<body>
<div class="box">
    <h1>Create Costing</h1>
    <a href="/">← Dashboard</a>

    <form method="POST" action="/costing/save">

        <h3>Project Details</h3>

        <input name="customer" placeholder="Customer Name" required>
        <input name="project" placeholder="Project Name" required>
        <input name="panel" placeholder="Panel Name" required>

        <h3>Cost Summary</h3>

        <input type="number" step="0.01" name="material" placeholder="Material Cost">
        <input type="number" step="0.01" name="labour" placeholder="Labour">
        <input type="number" step="0.01" name="fabrication" placeholder="Fabrication">
        <input type="number" step="0.01" name="busbar" placeholder="Busbar">
        <input type="number" step="0.01" name="wiring" placeholder="Wiring">
        <input type="number" step="0.01" name="overhead" placeholder="Overhead">
        <input type="number" step="0.01" name="packing" placeholder="Packing">
        <input type="number" step="0.01" name="transport" placeholder="Transport">
        <input type="number" step="0.01" name="profit" placeholder="Profit %">
        <input type="number" step="0.01" name="gst" placeholder="GST %">

        <h3>Material Items</h3>

        <table>
            <tr>
                <th>Description</th>
                <th>Rating</th>
                <th>Catalogue</th>
                <th>Qty</th>
                <th>LP</th>
                <th>Discount %</th>
            </tr>

            <tr>
                <td><input name="description[]" required></td>
                <td><input name="rating[]"></td>
                <td><input name="catalogue[]"></td>
                <td><input type="number" step="0.01" name="qty[]" value="1"></td>
                <td><input type="number" step="0.01" name="lp[]" value="0"></td>
                <td><input type="number" step="0.01" name="discount[]" value="0"></td>
            </tr>
        </table>

        <br>
        <button type="submit">Save Costing</button>
    </form>
</div>
</body>
</html>
