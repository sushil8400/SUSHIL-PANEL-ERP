<!DOCTYPE html>
<html>
<head>
    <title>Customers - SUSHIL PANEL ERP</title>
    <style>
        body{font-family:Arial;margin:30px;background:#f4f6f8}
        .box{background:white;padding:25px;border-radius:10px}
        input{padding:10px;margin:5px;width:220px}
        button{padding:10px 20px;background:#1677ff;color:white;border:0}
        table{width:100%;border-collapse:collapse;margin-top:20px;background:white}
        th,td{padding:10px;border:1px solid #ccc;text-align:left}
        th{background:#222;color:white}
    </style>
</head>
<body>
<div class="box">
    <h1>Customer Management</h1>
    <a href="/">← Dashboard</a>

    <h2>Add Customer</h2>

    <form method="POST">
        <input name="name" placeholder="Customer Name" required>
        <input name="contact" placeholder="Contact Number">
        <input name="email" placeholder="Email">
        <input name="address" placeholder="Address">
        <button type="submit">Save Customer</button>
    </form>

    <h2>Customer List</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Contact</th>
            <th>Email</th>
            <th>Address</th>
        </tr>

        {% for row in rows %}
        <tr>
            <td>{{ row.id }}</td>
            <td>{{ row.name }}</td>
            <td>{{ row.contact }}</td>
            <td>{{ row.email }}</td>
            <td>{{ row.address }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
