<!DOCTYPE html>
<html>
<head>
    <title>Projects - SUSHIL PANEL ERP</title>
    <style>
        body{font-family:Arial;margin:30px;background:#f4f6f8}
        .box{background:white;padding:25px;border-radius:10px}
        input,select{padding:10px;margin:5px;width:220px}
        button{padding:10px 20px;background:#1677ff;color:white;border:0}
        table{width:100%;border-collapse:collapse;margin-top:20px}
        th,td{padding:10px;border:1px solid #ccc}
        th{background:#222;color:white}
    </style>
</head>
<body>
<div class="box">
    <h1>Project Management</h1>
    <a href="/">← Dashboard</a>

    <h2>Add Project</h2>

    <form method="POST">
        <select name="customer_id" required>
            <option value="">Select Customer</option>
            {% for customer in customers %}
            <option value="{{ customer.id }}">
                {{ customer.name }}
            </option>
            {% endfor %}
        </select>

        <input name="name" placeholder="Project Name" required>
        <input name="location" placeholder="Project Location">

        <select name="status">
            <option value="New">New</option>
            <option value="Running">Running</option>
            <option value="Completed">Completed</option>
        </select>

        <button type="submit">Save Project</button>
    </form>

    <h2>Project List</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Project</th>
            <th>Location</th>
            <th>Status</th>
        </tr>

        {% for row in rows %}
        <tr>
            <td>{{ row.id }}</td>
            <td>{{ row.customer }}</td>
            <td>{{ row.name }}</td>
            <td>{{ row.location }}</td>
            <td>{{ row.status }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
