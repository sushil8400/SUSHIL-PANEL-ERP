<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUSHIL PANEL ERP - Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #e9f0f7;
}

.login-box {
    width: 380px;
    max-width: 92%;
    padding: 35px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
}

h1 {
    margin: 0;
    text-align: center;
    color: #174a75;
    font-size: 26px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin: 10px 0 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #aaa;
    border-radius: 6px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 25px;
    border: none;
    border-radius: 6px;
    background: #198754;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #146c43;
}

.message {
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 5px;
    background: #ffe5e5;
    color: #b00020;
    text-align: center;
}
</style>
</head>

<body>

<div class="login-box">

<h1>SUSHIL PANEL ERP</h1>

<div class="subtitle">
Electrical Panel Costing & Management System
</div>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}

<div class="message">
{{ message }}
</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<label>Username</label>

<input
type="text"
name="username"
placeholder="Enter username"
required
>

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter password"
required
>

<button type="submit">
LOGIN
</button>

</form>

</div>

</body>
</html>
