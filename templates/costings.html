<!DOCTYPE html>
<html>
<head>
    <title>Costing List - SUSHIL PANEL ERP</title>
    <style>
        body{font-family:Arial;margin:30px;background:#f4f6f8}
        .box{background:white;padding:25px}
        table{width:100%;border-collapse:collapse;margin-top:20px}
        th,td{padding:10px;border:1px solid #ccc}
        th{background:#222;color:white}
        a.button{padding:8px 12px;background:#1677ff;color:white;text-decoration:none}
    </style>
</head>
<body>
<div class="box">
    <h1>Costing List</h1>

    <a class="button" href="/">Dashboard</a>
    <a class="button" href="/costing/new">New Costing</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Costing Number</th>
            <th>Customer</th>
            <th>Project</th>
            <th>Panel</th>
            <th>Final Price</th>
            <th>Export</th>
        </tr>

        {% for row in rows %}
        <tr>
            <td>{{ row.id }}</td>
            <td>{{ row.number }}</td>
            <td>{{ row.customer }}</td>
            <td>{{ row.project }}</td>
            <td>{{ row.panel }}</td>
            <td>₹ {{ "%.2f"|format(row.final or 0) }}</td>
            <td>
                <a href="/export/{{ row.id }}">Excel</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>
</body>
</html>
