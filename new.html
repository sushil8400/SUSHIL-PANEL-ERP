{% extends "base.html" %}{% block body %}<h2>LK Costing Sheet</h2><form method="post"><div class="grid"><input name="customer" placeholder="Customer"><input name="project" placeholder="Project"><input name="panel" placeholder="Panel Name"></div><br><table class="table" id="t"><tr><th>LK Product</th><th>Description</th><th>Rating</th><th>Catalogue</th><th>Qty</th><th>LP Price</th><th>Discount %</th><th>Net Price</th><th></th></tr></table><br><button type="button" onclick="add()">+ Add Item</button><h3>Additional Cost</h3><div class="grid"><input name="labour" placeholder="Labour ₹" value="0"><input name="busbar" placeholder="Busbar ₹" value="0"><input name="fabrication" placeholder="Fabrication ₹" value="0"><input name="misc" placeholder="Miscellaneous ₹" value="0"><input name="overhead" placeholder="Overhead ₹" value="0"><input name="profit_pct" placeholder="Profit %" value="0"><input name="gst_pct" placeholder="GST %" value="18"></div><br><button>Save Costing</button></form>
<script>const P={{products|tojson}};function add(){let o='<option value="">Manual Item</option>'+P.map((p,i)=>`<option value="${i}">${p[0]} | ${p[2]} | ₹${p[4]}</option>`).join('');let tr=document.createElement('tr');tr.innerHTML=`<td><select onchange="fill(this)">${o}</select></td><td><input name="description[]"></td><td><input name="rating[]"></td><td><input name="catalogue[]"></td><td><input name="qty[]" value="1" oninput="calc(this)"></td><td><input name="lp[]" value="0" oninput="calc(this)"></td><td><input name="discount[]" value="0" oninput="calc(this)"></td><td class="net">0.00</td><td><button type="button" onclick="this.closest('tr').remove()">X</button></td>`;document.querySelector('#t').appendChild(tr)}function fill(s){let r=s.closest('tr'),p=P[s.value];if(!p)return;let x=r.querySelectorAll('input');x[0].value=p[0]+' - '+p[1];x[1].value=p[3];x[2].value=p[2];x[4].value=p[4];calc(s)}function calc(e){let r=e.closest('tr'),x=r.querySelectorAll('input'),n=(+x[3].value||0)*(+x[4].value||0)*(1-(+x[5].value||0)/100);r.querySelector('.net').innerText=n.toFixed(2)}add()</script>{% endblock %}
