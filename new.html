{% extends 'base.html' %}{% block content %}<h2>New Costing</h2><form method=post action=/save><div class=grid><input name=customer placeholder=Customer><input name=project placeholder=Project><input name=panel placeholder="Panel Name"><input name=profit type=number value=0 placeholder="Profit %"><input name=gst type=number value=18 placeholder="GST %"></div><h3>Material Items</h3><table id=t><tr><th>LK Item</th><th>Description</th><th>Rating</th><th>Catalogue</th><th>Qty</th><th>LP</th><th>Discount %</th><th>Net</th><th></th></tr></table><button type=button onclick=add()>+ Add Item</button><h3>Other Costs</h3><div class=grid><input id=material name=material type=number value=0 placeholder="Material auto total"><input name=labour type=number value=0 placeholder=Labour><input name=busbar type=number value=0 placeholder=Busbar><input name=fabrication type=number value=0 placeholder=Fabrication><input name=miscellaneous type=number value=0 placeholder=Miscellaneous><input name=overhead type=number value=0 placeholder=Overhead></div><br><button>Save Costing</button></form><script>const P={{products|tojson}};function add(){let r=document.createElement('tr');r.innerHTML=`<td><select onchange="pick(this)"><option>Select</option>${P.map(x=>`<option value="${x.id}">${x.description} | ${x.catalogue}</option>`).join('')}</select></td><td><input name="description[]"></td><td><input name="rating[]"></td><td><input name="catalogue[]"></td><td><input name="qty[]" type=number value=1 oninput=calc()></td><td><input name="lp[]" type=number value=0 oninput=calc()></td><td><input name="discount[]" type=number value=0 oninput=calc()></td><td class=net>0</td><td><button type=button onclick="this.parentNode.parentNode.remove();calc()">X</button></td>`;t.appendChild(r)}function pick(s){let x=P.find(a=>a.id==s.value),a=s.parentNode.parentNode.querySelectorAll('input');if(x){a[0].value=x.description;a[1].value=x.rating;a[2].value=x.catalogue;a[4].value=x.lp}calc()}function calc(){let z=0;[...t.rows].slice(1).forEach(r=>{let a=r.querySelectorAll('input'),n=(+a[3].value||0)*(+a[4].value||0)*(1-(+a[5].value||0)/100);r.querySelector('.net').textContent=n.toFixed(2);z+=n});material.value=z.toFixed(2)}add()</script>{% endblock %}
