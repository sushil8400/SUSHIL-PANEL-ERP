{% extends 'base.html' %}{% block content %}<h2>LK Product Master</h2><form method=post><input name=description placeholder=Description required><input name=rating placeholder=Rating><input name=catalogue placeholder="Catalogue No" required><input name=lp type=number step=.01 placeholder="LP Price"><button>Add Product</button></form><p>Complete LK price list ke items yahin add karein. LP price item select karte hi auto-fill hoga.</p><table><tr><th>Description</th><th>Rating</th><th>Catalogue</th><th>LP</th></tr>{% for x in rows %}<tr><td>{{x.description}}</td><td>{{x.rating}}</td><td>{{x.catalogue}}</td><td>{{x.lp}}</td></tr>{% endfor %}</table>{% endblock %}
